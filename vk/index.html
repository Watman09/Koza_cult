<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Crazy Cult</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1b242c;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-loader, #status-notice {
	display: none;
}

/* Загрузка: внизу экрана — только процент и тонкая светящаяся полоска. */
#status-loader {
	position: absolute;
	left: 0;
	right: 0;
	bottom: calc(max(4%, 22px) + env(safe-area-inset-bottom, 0px));
	width: min(72%, 460px);
	margin: 0 auto;
	flex-direction: column;
	align-items: center;
	gap: 10px;
	z-index: 1;
}

#status-text {
	min-height: 1.2em;
	color: rgba(255, 255, 255, 0.92);
	font-family: -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif;
	font-size: 15px;
	font-weight: 700;
	letter-spacing: 0.06em;
	font-variant-numeric: tabular-nums;
	text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);
}

#status-track {
	position: relative;
	width: 100%;
	height: 6px;
	border-radius: 999px;
	overflow: hidden;
	background-color: rgba(255, 255, 255, 0.16);
	box-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
}

#status-bar {
	position: absolute;
	top: 0;
	bottom: 0;
	left: 0;
	width: 0;
	border-radius: 999px;
	background: linear-gradient(90deg, #ffd447, #ff9a3c 60%, #ff654f);
	box-shadow: 0 0 12px rgba(255, 212, 71, 0.65);
	transition: width 0.3s ease-out;
}

/* Затемнение снизу — процент и полоска читаются поверх любой картинки. */
#status::after {
	content: '';
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	height: 22%;
	background: linear-gradient(to top, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
	pointer-events: none;
}

/* Размер ещё неизвестен — полоска бежит туда-сюда. */
#status-bar.unknown {
	width: 30%;
	animation: status-run 1.2s ease-in-out infinite alternate;
}

@keyframes status-run {
	from { transform: translateX(-10%); }
	to { transform: translateX(243%); }
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<!-- VK Игры: мост VK Bridge (кладёт сборка из tools/vk/) и VKWebAppInit сразу, до загрузки игры -->
<script src="vk-bridge.js"></script>
<script>if(window.vkBridge){vkBridge.send('VKWebAppInit').catch(function(){});}</script>
<script>document.addEventListener('contextmenu',function(e){e.preventDefault();});</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crazy Cult">
<style>html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;}</style>
<!-- Звук на iPhone: включить даже при беззвучном режиме и разбудить звук после касания -->
<script>(function(){var k={ctxs:[],starts:0,unlocked:0};window.__kozaAudio=k;['AudioContext','webkitAudioContext'].forEach(function(n){var O=window[n];if(!O)return;var W=function(a){var c=a===undefined?new O():new O(a);k.ctxs.push(c);return c;};W.prototype=O.prototype;window[n]=W;});if(window.AudioBufferSourceNode){var st=AudioBufferSourceNode.prototype.start;AudioBufferSourceNode.prototype.start=function(){k.starts++;return st.apply(this,arguments);};}function unlock(){k.unlocked++;try{if(navigator.audioSession){navigator.audioSession.type='playback';}}catch(e){}k.ctxs.forEach(function(c){if(c.state!=='running'){c.resume().catch(function(){});}});}['touchstart','touchend','pointerdown','mousedown','keydown'].forEach(function(e){document.addEventListener(e,unlock,true);});})();</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<div id="status-loader">
				<div id="status-text"></div>
				<div id="status-track"><div id="status-bar" class="unknown"></div></div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":42122508,"index.wasm":25646219},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusLoader = document.getElementById('status-loader');
	const statusBar = document.getElementById('status-bar');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');
	let лучшийПроцент = 0;

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusLoader.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	// Только процент; он не убывает. Размер неизвестен — бегущая полоска без цифр.
	function показатьЗагрузку(current, total) {
		if (current > 0 && total > 0) {
			лучшийПроцент = Math.max(лучшийПроцент, Math.min(100, Math.floor(current / total * 100)));
			statusBar.classList.remove('unknown');
			statusBar.style.width = лучшийПроцент + '%';
			statusText.textContent = лучшийПроцент + '%';
		} else if (лучшийПроцент === 0) {
			statusBar.classList.add('unknown');
			statusText.textContent = '';
		}
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				показатьЗагрузку(current, total);
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
